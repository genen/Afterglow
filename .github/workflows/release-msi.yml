name: Release installer

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Optional tag to build. Leave blank to build the current main commit.
        required: false
        type: string

permissions:
  contents: write

jobs:
  msi:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build the stable app
        shell: pwsh
        run: ./Windows/scripts/build.ps1 -Stable

      - name: Build the MSI
        shell: pwsh
        run: ./Windows/scripts/installer.ps1

      - name: Publish the MSI on the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Get-Content Windows/Afterglow.Windows/Afterglow.Windows.csproj -Raw
          if ($project -notmatch '<Version>(\d+\.\d+\.\d+)</Version>') { throw 'Version element was not found.' }
          $version = $Matches[1]
          $channel = if ($project -match '<InformationalVersion>[^<]*\b(stable|beta)\b') { $Matches[1] } else { 'stable' }
          $tag = "v$version"
          $title = "$version $channel"
          $asset = "Afterglow-Setup-$version-win-x64.msi"
          Copy-Item Windows/artifacts/Afterglow-Setup-win-x64.msi $asset
          $ErrorActionPreference = 'Continue'
          gh release view $tag --json tagName | Out-Null
          $missing = $LASTEXITCODE -ne 0
          $ErrorActionPreference = 'Stop'
          if ($missing) {
            gh release create $tag $asset --title $title --notes "Afterglow $title." --latest
          } else {
            gh release upload $tag --clobber $asset
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not publish $asset to $tag." }
