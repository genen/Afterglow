name: Release installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the MSI to, such as v1.4.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  msi:
    runs-on: windows-latest
    steps:
      - name: Checkout the release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build the stable app
        shell: pwsh
        run: ./Windows/scripts/build.ps1 -Stable

      - name: Build the MSI
        shell: pwsh
        run: ./Windows/scripts/installer.ps1

      - name: Upload the MSI to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload $env:RELEASE_TAG --clobber Windows/artifacts/Afterglow-Setup-win-x64.msi
